name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Deliberately minimal: the test suite touches no model, no GPU and no private artifact.
        run: |
          python -m pip install --upgrade pip
          pip install pytest quickjs

      - name: Run the test suite
        run: pytest -v

      - name: Public-release audit
        run: python scripts/audit_public_release.py

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every published module
        run: python -m compileall -q src tools scripts tests
      - name: Check shell drivers parse
        run: |
          status=0
          while IFS= read -r f; do bash -n "$f" || status=1; done \
            < <(find src scripts -name '*.sh')
          exit $status
