[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiertrustbench"
version = "0.1.0"
description = "Reproducibility code for VerifierTrustBench: decomposing scientific verification by LLMs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "pandas>=2.1", "matplotlib>=3.8", "requests>=2.31",
]
# No license is declared: the licensing decision is outstanding (see README).

[project.optional-dependencies]
dev = ["pytest>=7.4", "quickjs>=1.19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = []
